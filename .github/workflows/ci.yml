name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # tkinter is stdlib but distro-packaged. The ubuntu-latest image does not
      # ship python3-tk, so "import openhail.gui" fails there without this.
      # Windows and macOS runners bundle Tk with Python, so this is Ubuntu-only.
      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest tests -q
      # Separate step, run on every leg: the suite does not import the GUI, so a
      # broken gui.py would otherwise pass CI green and only fail for a user.
      - name: GUI imports and entry point resolves
        run: python -m pytest tests/test_gui_import.py -q
      # Constructing Tk needs a display on Linux. xvfb gives one, so the import
      # and client construction are exercised, then the window is destroyed.
      - name: GUI smoke (headless)
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 2
          DISPLAY=:99 python -c "import tkinter; r=tkinter.Tk(); r.destroy(); print('TK OK')"
        env:
          PYTHONPATH: src
      - name: GUI smoke (Windows/macOS)
        if: runner.os != 'Linux'
        run: python -c "import tkinter; r=tkinter.Tk(); r.destroy(); print('TK OK')"
        env:
          PYTHONPATH: src
